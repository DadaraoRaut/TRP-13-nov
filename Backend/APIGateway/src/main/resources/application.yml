spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: admin-service
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/admin/**
          filters:
            - name: RemoveRequestHeader
              args:
                name: Cookie   # optional if cookies interfere

        - id: supplier-service
          uri: lb://SUPPLIER-SERVICE
          predicates:
            - Path=/supplier/**   # All supplier APIs
          filters:
            - name: RemoveRequestHeader
              args:
                name: Cookie


        - id: user-auth-login
          uri: lb://USER-AUTHENTICATION
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: user-auth-roles
          uri: lb://USER-AUTHENTICATION
          predicates:
            - Path=/api/roles/**
          filters:
            - StripPrefix=1

        - id: user-auth-email
          uri: lb://USER-AUTHENTICATION
          predicates:
            - Path=/email/**
          filters:
            - StripPrefix=1

        # --- Employee Service ---
        - id: employee-service
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/employee/**      # All Employee endpoints
          filters:
            - StripPrefix=0         # Remove 'employee' prefix before forwarding


        - id: billing-service
          uri: lb://BILLING-SERVICE
          predicates:
            - Path=/api/billing/**      # ✅ fixed
          filters:
            - StripPrefix=0







      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
